name: Bootstrap TV release keystore

# 一次性流程：生成电视端固定发布密钥，产物随即由维护者取走并删除本运行。
on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate keystore
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore tv-release.jks -storetype JKS \
            -storepass 'ZhenguojianTv2026' -keypass 'ZhenguojianTv2026' \
            -alias zhenguojiantv -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=zhenguojian-tv, O=qiancheng, C=CN'
          echo 'SHA-256 证书指纹（供 ANDROID_CERT_SHA256 校验）：'
          keytool -list -v -keystore tv-release.jks -storepass 'ZhenguojianTv2026' -alias zhenguojiantv | grep -i 'SHA256:'
      - uses: actions/upload-artifact@v4
        with:
          name: tv-release-keystore
          path: tv-release.jks
          retention-days: 1
